<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo-list</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Todo-list</h1>

    <form id="todo-form" class="todo-form">
      <input
        id="todo-input"
        placeholder="Например: Купить помидор "
      >
      <button>Добавить</button>
    </form>

    <p id="error-message" class="error"></p>

    <section class="stats">
      <p>
        Осталось: <span id="remaining-count">0</span>,
        Выполнено: <span id="completed-count">0</span>
      </p>
    </section>

    <section class="filters">
      <button class="filter-btn active" data-filter="all">Все</button>
      <button class="filter-btn" data-filter="active">Активные</button>
      <button class="filter-btn" data-filter="completed">Завершённые</button>
    </section>

    <ul id="todo-list" class="todo-list"></ul>

    <p id="empty-message" class="empty-message" hidden>Список пуст</p>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
